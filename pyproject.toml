[project]
name = "MP3AgainstHumanity"
version = "0.1.0"
description = "Sitting on a train with no internet and a dead iPhone. All I have is a laptop, Python, and some MP3s. This script exists so I don’t have to listen to my own thoughts."
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
]
